# Voice Clone Service - 1.9 production compose
# Template: D:\care_asr_service_deploy\docker-compose.gxy.yml
#
# Deploy on 192.168.1.9 (flattalk network). See README.md for the full
# six-step deployment procedure.
#
# HTTPS: self-signed certs in ./certs/ (cert.pem + key.pem).
# Generated with: openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
#   -subj "/CN=192.168.1.9" -keyout key.pem -out cert.pem
# chmod 644 key.pem (container runs as uid 1000).

services:
  gxy-voiceclone:
    build:
      context: .
      dockerfile: Dockerfile.gxy
    image: gxy-voiceclone:latest
    container_name: gxy-voiceclone
    restart: unless-stopped
    # HTTPS via uvicorn SSL (self-signed certs, LAN use only)
    # --workers 2: local TTS synthesis blocks the worker event loop for
    # minutes on long text; a second worker keeps /voices & /health
    # responsive while worker 1 is busy synthesizing.
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8021"
      - --workers
      - "2"
      - --ssl-keyfile
      - /app/certs/key.pem
      - --ssl-certfile
      - /app/certs/cert.pem
    ports:
      - "8021:8021"
    env_file:
      - .env
    # 默认数据目录为 $APPDATA/VoiceClone/data；容器内无 APPDATA 时回退
    # ROOT_DIR(/app)/VoiceClone/data —— 那是容器可写层，未挂载，容器重建即丢
    # （2026-09-14 三个音色即因此丢失）。显式设为 /app/data 使语音数据落到
    # 挂载卷 ./data:/app/data（/app/data/VoiceClone/data），重建不丢。
    # DB_PATH 由 .env 显式指定 data/voiceclone.db，不受 APPDATA 影响。
    environment:
      - APPDATA=/app/data
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./certs:/app/certs:ro
    networks:
      - flattalk-net
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request; _c=ssl.create_default_context(); _c.check_hostname=False; _c.verify_mode=ssl.CERT_NONE; urllib.request.urlopen('https://127.0.0.1:8021/health', timeout=3, context=_c)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  flattalk-net:
    external: true
    name: flattalk_flattalk-network